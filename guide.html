const d64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)), e64=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
async function bitsFor(pw){const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);return crypto.subtle.deriveBits({name:"PBKDF2",salt:d64(SALT),iterations:ITER,hash:"SHA-256"},k,256);}
async function open(bits){
  const key=await crypto.subtle.importKey("raw",bits,"AES-GCM",false,["decrypt"]);
  const dec=async u8=>crypto.subtle.decrypt({name:"AES-GCM",iv:u8.slice(0,12)},key,u8.slice(12));
  const page=JSON.parse(new TextDecoder().decode(await dec(d64(PAYLOAD))));
  sessionStorage.setItem("fw-pk",e64(bits));
  const urls=await Promise.all(page.assets.map(async a=>{const r=await fetch(a.f);const b=await dec(new Uint8Array(await r.arrayBuffer()));return [a.p,URL.createObjectURL(new Blob([b],{type:a.t}))];}));
