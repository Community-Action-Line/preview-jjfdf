<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow"><title>Preview</title>
<style>
:root{color-scheme:light dark}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#111;color:#eee;font:16px/1.5 system-ui,-apple-system,sans-serif}
form{width:min(340px,calc(100vw - 32px));display:flex;flex-direction:column;gap:12px}
h1{font-size:18px;font-weight:600;margin:0 0 4px}
input{font:inherit;padding:12px 14px;border-radius:8px;border:1px solid #444;background:#1c1c1c;color:#fff}
button{font:inherit;font-weight:600;padding:12px;border-radius:8px;border:0;background:#fff;color:#111;cursor:pointer}
p{margin:0;font-size:14px;color:#f88;min-height:1.5em}
</style></head>
<body><form id="f" hidden><h1>This preview is password protected.</h1><input id="pw" type="password" placeholder="Password" autocomplete="current-password" autofocus><button>Open</button><p id="e"></p></form>
<script>
(()=>{
const SALT="WJOmLruS9SyBDV7ijp4OHQ==", ITER=310000, PAYLOAD="6zI1R/nZbnle/0V5lZtVAbWPBpzn7VcRLzbNDhWAlV5siKE1J6JQ88mpEsWRgxKjMbRIs0tZrALxPHzyUL+iCAHrfIbkG0/7SuJJ0qjYwaSJcfGlpvLqtkQRkmF63ELn05XzPR3CL40hl2MsaPGF5TIy1VYJKPH/ZF0EtvjtCLNU6wwU0fMzDea2DpMhE1N2mmM8vPGkRTXyJz2OWMuAUViOUEAwX0l3FV+YU7XY39bwi+QIheaO3yvjrN67buoy+bUPU2JWRZftN2IvRSjCcZAlPTckH9oweX5K90YWltH+iB4hU8v0hvvQLu7dbZ3FpKPzHuXvnYnlQkzwiACgQbfojqrLoxs5v97mhVIUL9jqbmt4WEFp2n0DErUSksHMC5KILWFeQk/dau+qhYkuVwAhUIXPIZ6KFup62hax5OKD9+Ta70Wtm5WMHpTbY9J8ajJzlnhm6G3Pg81BPL6eLd+hag3+H0E5rjJtG7smcRxsmy/mbqQgZmLo13Yfcindb1grY0q/UGKBvduMn2MKPitJbyTucgVoicC9Bm7P3wRRRlZxW819kYpeYGHZzV0HnTQokVt0LP5v8ZkOZC0gWSnptdo/Zs8=";
const d64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)), e64=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
async function bitsFor(pw){const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);return crypto.subtle.deriveBits({name:"PBKDF2",salt:d64(SALT),iterations:ITER,hash:"SHA-256"},k,256);}
async function open(bits){
  const key=await crypto.subtle.importKey("raw",bits,"AES-GCM",false,["decrypt"]);
  const dec=async u8=>crypto.subtle.decrypt({name:"AES-GCM",iv:u8.slice(0,12)},key,u8.slice(12));
  const page=JSON.parse(new TextDecoder().decode(await dec(d64(PAYLOAD))));
  sessionStorage.setItem("fw-pk",e64(bits));
  const urls=await Promise.all(page.assets.map(async a=>{const r=await fetch(a.f);const b=await dec(new Uint8Array(await r.arrayBuffer()));return [a.p,URL.createObjectURL(new Blob([b],{type:a.t}))];}));
  let html=page.html; for(const [p,u] of urls) html=html.split(p).join(u);
  document.open(); document.write(html); document.close();
}
const f=document.getElementById("f"), e=document.getElementById("e");
f.addEventListener("submit",async ev=>{ev.preventDefault();e.textContent="Opening…";try{await open(await bitsFor(document.getElementById("pw").value));}catch(_){e.textContent="Wrong password.";}});
const saved=sessionStorage.getItem("fw-pk");
if(saved) open(d64(saved)).catch(()=>{sessionStorage.removeItem("fw-pk");f.hidden=false;}); else f.hidden=false;
})();
</script></body></html>
